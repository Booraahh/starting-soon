<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Starting Soon</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    loop>

    <source
      src="https://raw.githubusercontent.com/Booraahh/starting-soon/main/EMPEZANDO%20STREAM.mp4"
      type="video/mp4">

  </video>

  <script>
    const video = document.getElementById("video");

    video.muted = true;
    video.defaultMuted = true;

    function playVideo() {
      video.play().catch(() => {});
    }

    window.addEventListener("load", playVideo);
    video.addEventListener("canplay", playVideo);
  </script>

</body>
</html>
